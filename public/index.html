<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marginalia</title>
<link rel="stylesheet" href="/style.css">
</head><body>
<header class="topbar">
  <a class="brand" href="/">Margin<span>alia</span></a>
  <div class="topbar-right">
    <span class="who" id="who"></span>
    <button class="btn btn-soft" id="logout" type="button">Log out</button>
  </div>
</header>
<main class="app">
  <div class="card">
    <h2>Analyze a PDF</h2>
    <label class="dropzone" id="dropzone">
      <input type="file" id="file" accept="application/pdf">
      <strong id="fileLabel">Choose a PDF or drop it here</strong>
      <small>Text-based PDFs only. Long files use roughly the first 60,000 characters.</small>
    </label>
    <div class="actions">
      <button class="btn" id="go" type="button" disabled>Extract &amp; summarize</button>
      <span class="status" id="status" role="status"></span>
    </div>
    <dl class="stats hidden" id="stats" aria-label="PDF statistics">
      <div><dt>Pages</dt><dd id="pageCount">0</dd></div>
      <div><dt>Words</dt><dd id="wordCount">0</dd></div>
      <div><dt>Characters</dt><dd id="charCount">0</dd></div>
    </dl>
  </div>
  <div class="card result hidden" id="result"></div>
  <section class="card qa hidden" id="qa">
    <h2>Ask about this document</h2>
    <form class="qa-form" id="qaForm">
      <label class="visually-hidden" for="question">Your question</label>
      <input id="question" name="question" type="text" maxlength="1000" placeholder="What is the main conclusion?" required>
      <button class="btn" id="ask" type="submit">Ask</button>
    </form>
    <div class="status" id="qaStatus" role="status" aria-live="polite"></div>
    <div class="answer hidden" id="answer" aria-live="polite"></div>
  </section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="/script.js"></script>
</body></html>
